name: Android
on:
  push:
    paths: ['android/**', 'supabase/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'supabase/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: android
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Перевіряє, що gradle-wrapper.jar — справжній (захист від підміни в PR).
          validate-wrappers: true
      - name: Формат (ktlint)
        run: ./gradlew spotlessCheck
      - name: Unit-тести
        run: ./gradlew test -PwarningsAsErrors=true
      # Спершу release-збірка, потім Lint: двічі (efa1c82, 26e3dc9) KSP2 падав з «could not be resolved»
      # лише тоді, коли release-KSP запускався паралельно з аналізом Lint в одному процесі Gradle.
      # Після збірки release-KSP уже виконано, і Lint лише аналізує.
      # 10.11 KSP2 знову випадково падав («Context could not be resolved») уже й тут, без Lint.
      # Код при цьому коректний: повторний запуск у чистому процесі Gradle проходить. Тому — один повтор
      # без демона й кешу збірки; справжня помилка компіляції впаде і вдруге.
      - name: Release-збірка (R8)
        run: |
          ./gradlew :app:assembleRelease -PwarningsAsErrors=true || {
            echo "::warning::KSP-збій — повтор у новому процесі Gradle"
            ./gradlew --stop
            ./gradlew :app:assembleRelease -PwarningsAsErrors=true --no-build-cache
          }
      - name: Android Lint
        run: ./gradlew :app:lintRelease
      - name: Звіти
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
