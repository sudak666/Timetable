name: Android
on:
  push:
    paths: ['android/**', 'supabase/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'supabase/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: android
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Перевіряє, що gradle-wrapper.jar — справжній (захист від підміни в PR).
          validate-wrappers: true
      - name: Формат (ktlint)
        run: ./gradlew spotlessCheck
      - name: Unit-тести
        run: ./gradlew test -PwarningsAsErrors=true
      - name: Android Lint
        run: ./gradlew :app:lintRelease
      - name: Release-збірка (R8)
        run: ./gradlew :app:assembleRelease -PwarningsAsErrors=true
      - name: Звіти
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
