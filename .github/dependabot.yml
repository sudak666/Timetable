version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      kotlin-and-tools:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*', 'com.android.tools*']
      androidx:
        patterns: ['androidx.*']
      libraries:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
