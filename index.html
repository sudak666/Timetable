<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1024">
<title>Розклад уроків</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#1b1c33;--muted:#6b6f8e;--line:#e4e6f3;--accent:#6c5ce7;--glow:rgba(108,92,231,.22);--brk:#f0f1fa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1024;--card:#1a1b36;--text:#eceefe;--muted:#9a9dc2;--line:#2a2c4f;--glow:rgba(108,92,231,.45);--brk:#15162d}}
:root[data-theme=dark]{--bg:#0f1024;--card:#1a1b36;--text:#eceefe;--muted:#9a9dc2;--line:#2a2c4f;--glow:rgba(108,92,231,.45);--brk:#15162d}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 48px;transition:background .3s}
.wrap{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(24px,5vw,36px);font-weight:800;background:linear-gradient(90deg,var(--accent),#fd79a8);-webkit-background-clip:text;background-clip:text;color:transparent}
#clock{color:var(--muted);font-weight:600}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.top{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:720px){.top{grid-template-columns:1fr}}
.now{background:linear-gradient(135deg,var(--accent),#a29bfe);color:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px var(--glow)}
.now.brk{background:linear-gradient(135deg,#00b894,#55efc4)}
.now small{opacity:.9;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.now h2{font-size:clamp(22px,5vw,30px);margin:4px 0}
.big{font-size:clamp(34px,8vw,48px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width 1s linear}
.side{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.side h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:20px;color:#fff;font-weight:600;cursor:pointer;border:0}
.chip b{opacity:.8;font-weight:400;margin-left:4px}
.dayprog{margin-top:14px;font-size:13px;color:var(--muted)}
.dayprog .bar{background:var(--line)}.dayprog .bar i{background:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.day h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day h3 span.end{font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:11px;background:var(--accent);color:#fff;padding:3px 8px;border-radius:8px;margin-left:6px}
.l{display:grid;grid-template-columns:28px 92px 1fr;gap:8px;align-items:center;padding:9px 8px;border-radius:10px;transition:opacity .2s,background .2s}
.n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.t{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.s{font-weight:600}
.b{display:flex;justify-content:center;gap:6px;font-size:11px;color:var(--muted);background:var(--brk);border-radius:8px;padding:3px;margin:3px 0}
.b.long{color:#00a383;font-weight:600}
.past{opacity:.4}
.l.cur{background:var(--glow)}
.b.cur{background:#00b894;color:#fff}
.opt{font-size:11px;color:var(--muted);font-weight:400}
.single .day:not(.show){display:none}
.hl .l:not(.match){opacity:.2}
.l.match{background:var(--glow)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Розклад уроків</h1><div id="clock"></div></div>
  <div class="tools">
    <button id="notif" title="Нагадування за 2 хв до уроку">🔔</button>
    <button id="theme" title="Тема">🌓</button>
  </div>
</header>
<div class="top">
  <section class="now" id="now"></section>
  <aside class="side">
    <h4 id="bagT">Рюкзак на завтра</h4>
    <div class="chips" id="bag"></div>
    <div class="dayprog" id="dp"></div>
  </aside>
</div>
<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<section class="side" style="margin-top:16px">
  <h4>Уроків на тиждень · натисни, щоб підсвітити</h4>
  <div class="chips" id="stats"></div>
</section>
</div>
<script>
const T=['8:30-9:15','9:25-10:10','10:30-11:15','11:25-12:10','12:30-13:15','13:35-14:20','14:30-15:15'];
const D=[
 ['Понеділок',['Математика','Всесв. історія','Література','Англ. мова','Укр. мова','STEM','Математика*']],
 ['Вівторок',['Література','Інформатика','Укр. мова','Географія','Математика','Фіз-ра']],
 ['Середа',['Англ. мова','Математика','Технології','Укр. мова','Громад. освіта','Довкілля','STEM']],
 ['Четвер',['Математика','Укр. мова','Географія','Фіз-ра','Англ. мова','Мистецтво','ЗБД']],
 ['П’ятниця',['Всесв. історія','Англ. мова','Література','Фіз-ра','Довкілля','Математика']]
];
const C={'Математика':'#6c5ce7','Всесв. історія':'#e17055','Література':'#e84393','Англ. мова':'#0984e3','Укр. мова':'#e1a800','STEM':'#00b894','Інформатика':'#00a8a8','Географія':'#16a085','Фіз-ра':'#d63031','Технології':'#8e7cf0','Громад. освіта':'#c0398a','Довкілля':'#27ae60','Мистецтво':'#f39c12','ЗБД':'#636e72'};
const m=s=>{const[h,mm]=s.split(':');return h*60+ +mm};
const R=T.map(t=>t.split('-').map(m));
const nm=s=>s.replace('*','');
const $=id=>document.getElementById(id);
let sel=null,hl=null,notifOn=false,lastNotif='';
try{notifOn=localStorage.notif==='1'&&Notification.permission==='granted'}catch{}

const now=()=>{const d=new Date();return{d,wd:d.getDay()-1,min:d.getHours()*60+d.getMinutes()+d.getSeconds()/60}};
const nextDay=wd=>{let n=wd+1;while(n<7&&!D[n])n++;return D[n]?n:0};
const hms=x=>{const s=Math.max(0,Math.ceil(x*60)),h=Math.floor(s/3600),mi=Math.floor(s%3600/60),se=s%60,p=v=>String(v).padStart(2,'0');return(h?h+':'+p(mi):mi)+':'+p(se)};

function renderGrid(){
  const{wd,min}=now();
  $('grid').innerHTML=D.map(([dn,ls],i)=>{
    const today=i===wd,st=(a,b)=>today?(min>=b?'past':min>=a?'cur':''):'';
    let h='';
    ls.forEach((s,j)=>{
      const[a,b]=R[j];
      h+=`<div class="l ${st(a,b)} ${hl===nm(s)?'match':''}"><span class="n" style="background:${C[nm(s)]}">${j+1}</span><span class="t">${T[j].replace('-',' – ')}</span><span class="s">${nm(s)}${s.endsWith('*')?' <span class="opt">факультатив</span>':''}</span></div>`;
      if(ls[j+1]){const e=R[j+1][0],len=e-b;h+=`<div class="b ${len>=20?'long':''} ${st(b,e)}">☕ перерва ${len} хв${len>=20?' · велика':''}</div>`}
    });
    return`<div class="day ${today?'today':''} ${i===sel?'show':''}"><h3><span>${dn}${today?'<span class="badge">Сьогодні</span>':''}</span><span class="end">${ls.length} ур. · до ${T[ls.length-1].split('-')[1]}</span></h3>${h}</div>`;
  }).join('');
  $('grid').classList.toggle('single',sel!==null);
  $('grid').classList.toggle('hl',!!hl);
}

function status(wd,min){
  const ls=D[wd]?.[1];
  if(ls)for(let j=0;j<ls.length;j++){
    const[a,b]=R[j];
    if(min>=a&&min<b)return{k:'lesson',j,a,b,ls};
    if(min<a)return{k:j?'break':'before',j,a,b:j?R[j-1][1]:null,ls};
  }
  return{k:'done'};
}

function renderNow(){
  const{d,wd,min}=now(),s=status(wd,min),el=$('now');
  $('clock').textContent=d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('uk-UA');
  el.classList.toggle('brk',s.k==='break');
  if(s.k==='lesson'){
    const nx=s.ls[s.j+1];
    el.innerHTML=`<small>Зараз · ${s.j+1} урок з ${s.ls.length}</small><h2>${nm(s.ls[s.j])}</h2><div class="big">${hms(s.b-min)}</div><div>до дзвінка${nx?` · далі ${nm(nx)}`:' · останній урок 🎉'}</div><div class="bar"><i style="width:${(min-s.a)/(s.b-s.a)*100}%"></i></div>`;
  }else if(s.k==='break'){
    el.innerHTML=`<small>☕ Перерва ${s.a-s.b} хв</small><h2>Далі: ${nm(s.ls[s.j])}</h2><div class="big">${hms(s.a-min)}</div><div>до ${s.j+1} уроку о ${T[s.j].split('-')[0]}</div><div class="bar"><i style="width:${(min-s.b)/(s.a-s.b)*100}%"></i></div>`;
  }else if(s.k==='before'){
    el.innerHTML=`<small>Сьогодні ${s.ls.length} уроків</small><h2>Перший: ${nm(s.ls[0])}</h2><div class="big">${hms(s.a-min)}</div><div>до початку о 8:30</div>`;
  }else{
    const n=nextDay(wd);
    el.innerHTML=`<small>Уроки закінчились 🎉</small><h2>Далі: ${D[n][0]}</h2><div>Перший урок — ${nm(D[n][1][0])} о 8:30</div>`;
  }
  // day progress
  const ls=D[wd]?.[1];
  if(ls){const a=R[0][0],b=R[ls.length-1][1],p=Math.min(1,Math.max(0,(min-a)/(b-a)));
    $('dp').innerHTML=`Навчальний день: ${Math.round(p*100)}%<div class="bar"><i style="width:${p*100}%"></i></div>`}
  else $('dp').textContent='Вихідний 😎';
  // notifications
  if(notifOn&&(s.k==='break'||s.k==='before')&&s.a-min<=2&&s.a-min>0){
    const key=wd+'-'+s.j;
    if(key!==lastNotif){lastNotif=key;try{new Notification('Через 2 хв: '+nm(s.ls[s.j]),{body:`${s.j+1} урок о ${T[s.j].split('-')[0]}`})}catch{}}
  }
}

function renderSide(){
  const{wd,min}=now(),s=status(wd,min);
  const t=(s.k==='done'||!D[wd])?nextDay(wd):wd;
  $('bagT').textContent=t===wd?'Рюкзак на сьогодні':'Рюкзак на '+D[t][0].toLowerCase();
  const u=[...new Set(D[t][1].map(nm))];
  $('bag').innerHTML=u.map(x=>`<span class="chip" style="background:${C[x]}">${x}</span>`).join('');
  const cnt={};D.forEach(([,l])=>l.forEach(x=>cnt[nm(x)]=(cnt[nm(x)]||0)+1));
  $('stats').innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="chip" data-s="${k}" style="background:${C[k]};${hl&&hl!==k?'opacity:.35':''}">${k}<b>×${v}</b></button>`).join('');
}

$('stats').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;hl=hl===b.dataset.s?null:b.dataset.s;renderGrid();renderSide()};
$('tabs').innerHTML=['Весь тиждень',...D.map(x=>x[0])].map((t,i)=>`<button data-i="${i-1}">${t}</button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel=+b.dataset.i<0?null:+b.dataset.i;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));renderGrid()};
$('tabs').children[0].classList.add('on');
$('theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.theme=r.dataset.theme}catch{}};
try{if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme}catch{}
const setN=()=>$('notif').classList.toggle('on',notifOn);
$('notif').onclick=async()=>{
  if(!('Notification'in window))return alert('Браузер не підтримує сповіщення');
  if(!notifOn&&Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')return;
  notifOn=!notifOn;try{localStorage.notif=notifOn?'1':'0'}catch{}setN();
};
setN();
renderGrid();renderSide();renderNow();
setInterval(renderNow,1000);
setInterval(()=>{renderGrid();renderSide()},20000);
</script>
</body>
</html>
