<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1024">
<title>Розклад уроків</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#1b1c33;--muted:#6b6f8e;--line:#e4e6f3;--accent:#6c5ce7;--glow:rgba(108,92,231,.22);--brk:#f0f1fa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1024;--card:#1a1b36;--text:#eceefe;--muted:#9a9dc2;--line:#2a2c4f;--glow:rgba(108,92,231,.45);--brk:#15162d}}
:root[data-theme=dark]{--bg:#0f1024;--card:#1a1b36;--text:#eceefe;--muted:#9a9dc2;--line:#2a2c4f;--glow:rgba(108,92,231,.45);--brk:#15162d}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 48px;transition:background .3s}
.wrap{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(24px,5vw,36px);font-weight:800;background:linear-gradient(90deg,var(--accent),#fd79a8);-webkit-background-clip:text;background-clip:text;color:transparent}
#clock{color:var(--muted);font-weight:600}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.top{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:720px){.top{grid-template-columns:1fr}}
.now{background:linear-gradient(135deg,var(--accent),#a29bfe);color:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px var(--glow)}
.now.brk{background:linear-gradient(135deg,#00b894,#55efc4)}
.now small{opacity:.9;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.now h2{font-size:clamp(22px,5vw,30px);margin:4px 0}
.big{font-size:clamp(34px,8vw,48px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width 1s linear}
.side{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.side h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:20px;color:#fff;font-weight:600;cursor:pointer;border:0}
.chip b{opacity:.8;font-weight:400;margin-left:4px}
.dayprog{margin-top:14px;font-size:13px;color:var(--muted)}
.dayprog .bar{background:var(--line)}.dayprog .bar i{background:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.day h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day h3 span.end{font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:11px;background:var(--accent);color:#fff;padding:3px 8px;border-radius:8px;margin-left:6px}
.l{display:grid;grid-template-columns:28px 92px 1fr;gap:8px;align-items:center;padding:9px 8px;border-radius:10px;transition:opacity .2s,background .2s}
.n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.t{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.s{font-weight:600}
.b{display:flex;justify-content:center;gap:6px;font-size:11px;color:var(--muted);background:var(--brk);border-radius:8px;padding:3px;margin:3px 0}
.b.long{color:#00a383;font-weight:600}
.past{opacity:.4}
.l.cur{background:var(--glow)}
.b.cur{background:#00b894;color:#fff}
.opt{font-size:11px;color:var(--muted);font-weight:400}
:root .moon,:root[data-theme=dark] .sun{display:none}:root[data-theme=dark] .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sun{display:none}:root:not([data-theme=light]) .moon{display:block}}
.ic{width:42px;height:42px;padding:0;display:grid;place-items:center;transition:transform .2s}
.ic:hover{transform:rotate(-12deg) scale(1.1)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#notif.on svg{animation:ring 1.2s ease 1}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:200% center}}
h1{background-size:200% auto;animation:shine 6s linear infinite}
.top>*,.day{animation:up .5s both}
.day:nth-child(2){animation-delay:.07s}.day:nth-child(3){animation-delay:.14s}.day:nth-child(4){animation-delay:.21s}.day:nth-child(5){animation-delay:.28s}
.day{transition:transform .2s}.day:hover{transform:translateY(-4px)}
.l.cur{animation:pulse 2s infinite}
.now{cursor:pointer;position:relative;overflow:hidden}
.now .em{position:absolute;right:16px;top:12px;font-size:44px;animation:float 3s ease-in-out infinite}
.chip{transition:transform .15s}.chip:hover{transform:scale(1.08)}
.fun{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:20px}
.fun .side{animation:up .5s .2s both}
.fun p{font-size:15px;line-height:1.45}
.fun .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.stars{font-size:24px;letter-spacing:2px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gr{margin-top:16px;animation:up .5s .3s both}
.gr h4{display:flex;justify-content:space-between;align-items:center}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 14px}
.sum div{background:var(--brk);border-radius:14px;padding:12px;text-align:center}
.sum b{display:block;font-size:24px;font-weight:900}
.sum small{color:var(--muted);font-size:12px}
.pos{color:#00a383}.neg{color:#d63031}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form select,.form input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 10px}
.gbtn{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:10px 0}
@media(max-width:520px){.gbtn{grid-template-columns:repeat(6,1fr)}}
.gbtn button{padding:10px 0;font-weight:900;border:0;color:#fff;transition:transform .15s}
.gbtn button:hover{transform:scale(1.1)}
.gl{max-height:300px;overflow:auto;margin-top:10px}
.gi{display:grid;grid-template-columns:42px 1fr auto auto;gap:10px;align-items:center;padding:8px;border-radius:10px}
.gi+.gi{border-top:1px dashed var(--line)}
.gi .g{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px}
.gi small{color:var(--muted);display:block}
.gi .x{border:0;background:none;color:var(--muted);padding:4px}
.lvl{margin:6px 0 4px;font-weight:800}
.lvl .bar{background:var(--line)}.lvl .bar i{background:linear-gradient(90deg,#fdcb6e,#e17055)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bd{font-size:13px;padding:5px 10px;border-radius:20px;background:var(--brk);opacity:.35}
.bd.got{opacity:1;background:linear-gradient(135deg,#fdcb6e,#fab1a0);color:#1b1c33;font-weight:700}
.rates{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
#gl .ok{border:0;background:#00b894;color:#fff;padding:4px 10px;margin-right:4px;font-weight:900}
.gi.wait{background:var(--brk);border:1px dashed #fdcb6e}
#pay{background:#00b894;color:#fff;border:0}
.single .day:not(.show){display:none}
.hl .l:not(.match){opacity:.2}
.l.match{background:var(--glow)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Розклад уроків</h1><div id="clock"></div></div>
  <div class="tools">
    <button id="notif" class="ic" title="Нагадування за 2 хв до уроку"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    <button id="theme" class="ic" title="Тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<div class="top">
  <section class="now" id="now"></section>
  <aside class="side">
    <h4 id="bagT">Рюкзак на завтра</h4>
    <div class="chips" id="bag"></div>
    <div class="dayprog" id="dp"></div>
  </aside>
</div>
<div class="fun">
  <section class="side"><h4>🦉 Цікавий факт</h4><p id="fact"></p><div class="row"><span></span><button id="nf">Ще факт</button></div></section>
  <section class="side"><h4>🌈 До вихідних</h4><p id="wk"></p><h4 style="margin-top:12px">⭐ Мої зірочки за сьогодні</h4><div class="row"><span class="stars" id="st"></span><button id="addst">+ зірка</button></div></section>
</div>
<nav class="tabs" id="tabs"></nav>
<main class="grid" id="grid"></main>
<section class="side gr" id="grades">
  <h4><span>🏆 Мої оцінки та нагороди</span><span style="text-transform:none;letter-spacing:0"><span id="pendN" style="color:#e17055;margin-right:8px"></span><span id="gmode"></span></span></h4>
  <div class="sum">
    <div><small>Сьогодні</small><b id="sD">0 ₴</b></div>
    <div><small>Цей тиждень</small><b id="sW">0 ₴</b></div>
    <div><small>Цей місяць</small><b id="sM">0 ₴</b></div>
    <div><small>До виплати</small><b id="sB">0 ₴</b></div>
  </div>
  <div class="lvl" id="lvl"></div>
  <div class="badges" id="badges"></div>
  <h4 style="margin-top:16px">➕ Додати оцінку</h4>
  <div class="form"><select id="gs"></select><input type="date" id="gd"><button id="pay" hidden>💸 Виплатити баланс</button></div>
  <div class="gbtn" id="gb"></div>
  <div class="gl" id="gl"></div>
  <div class="rates" id="rates"></div>
</section>
<section class="side" style="margin-top:16px">
  <h4>Уроків на тиждень · натисни, щоб підсвітити</h4>
  <div class="chips" id="stats"></div>
</section>
</div>
<script>
const T=['8:30-9:15','9:25-10:10','10:30-11:15','11:25-12:10','12:30-13:15','13:35-14:20','14:30-15:15'];
const D=[
 ['Понеділок',['Математика','Всесв. історія','Література','Англ. мова','Укр. мова','STEM','Математика*']],
 ['Вівторок',['Література','Інформатика','Укр. мова','Географія','Математика','Фіз-ра']],
 ['Середа',['Англ. мова','Математика','Технології','Укр. мова','Громад. освіта','Довкілля','STEM']],
 ['Четвер',['Математика','Укр. мова','Географія','Фіз-ра','Англ. мова','Мистецтво','ЗБД']],
 ['П’ятниця',['Всесв. історія','Англ. мова','Література','Фіз-ра','Довкілля','Математика']]
];
const C={'Математика':'#6c5ce7','Всесв. історія':'#e17055','Література':'#e84393','Англ. мова':'#0984e3','Укр. мова':'#e1a800','STEM':'#00b894','Інформатика':'#00a8a8','Географія':'#16a085','Фіз-ра':'#d63031','Технології':'#8e7cf0','Громад. освіта':'#c0398a','Довкілля':'#27ae60','Мистецтво':'#f39c12','ЗБД':'#636e72'};
const m=s=>{const[h,mm]=s.split(':');return h*60+ +mm};
const R=T.map(t=>t.split('-').map(m));
const nm=s=>s.replace('*','');
const $=id=>document.getElementById(id);
let sel=null,hl=null,notifOn=false,lastNotif='';
try{notifOn=localStorage.notif==='1'&&Notification.permission==='granted'}catch{}

const now=()=>{const d=new Date();return{d,wd:d.getDay()-1,min:d.getHours()*60+d.getMinutes()+d.getSeconds()/60}};
const nextDay=wd=>{let n=wd+1;while(n<7&&!D[n])n++;return D[n]?n:0};
const hms=x=>{const s=Math.max(0,Math.ceil(x*60)),h=Math.floor(s/3600),mi=Math.floor(s%3600/60),se=s%60,p=v=>String(v).padStart(2,'0');return(h?h+':'+p(mi):mi)+':'+p(se)};

var renderGrid=function(){
  const{wd,min}=now();
  $('grid').innerHTML=D.map(([dn,ls],i)=>{
    const today=i===wd,st=(a,b)=>today?(min>=b?'past':min>=a?'cur':''):'';
    let h='';
    ls.forEach((s,j)=>{
      const[a,b]=R[j];
      h+=`<div class="l ${st(a,b)} ${hl===nm(s)?'match':''}"><span class="n" style="background:${C[nm(s)]}">${j+1}</span><span class="t">${T[j].replace('-',' – ')}</span><span class="s">${nm(s)}${s.endsWith('*')?' <span class="opt">факультатив</span>':''}</span></div>`;
      if(ls[j+1]){const e=R[j+1][0],len=e-b;h+=`<div class="b ${len>=20?'long':''} ${st(b,e)}">☕ перерва ${len} хв${len>=20?' · велика':''}</div>`}
    });
    return`<div class="day ${today?'today':''} ${i===sel?'show':''}"><h3><span>${dn}${today?'<span class="badge">Сьогодні</span>':''}</span><span class="end">${ls.length} ур. · до ${T[ls.length-1].split('-')[1]}</span></h3>${h}</div>`;
  }).join('');
  $('grid').classList.toggle('single',sel!==null);
  $('grid').classList.toggle('hl',!!hl);
}

function status(wd,min){
  const ls=D[wd]?.[1];
  if(ls)for(let j=0;j<ls.length;j++){
    const[a,b]=R[j];
    if(min>=a&&min<b)return{k:'lesson',j,a,b,ls};
    if(min<a)return{k:j?'break':'before',j,a,b:j?R[j-1][1]:null,ls};
  }
  return{k:'done'};
}

var renderNow=function(){
  const{d,wd,min}=now(),s=status(wd,min),el=$('now');
  $('clock').textContent=d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('uk-UA');
  el.classList.toggle('brk',s.k==='break');
  if(s.k==='lesson'){
    const nx=s.ls[s.j+1];
    el.innerHTML=`<small>Зараз · ${s.j+1} урок з ${s.ls.length}</small><h2>${nm(s.ls[s.j])}</h2><div class="big">${hms(s.b-min)}</div><div>до дзвінка${nx?` · далі ${nm(nx)}`:' · останній урок 🎉'}</div><div class="bar"><i style="width:${(min-s.a)/(s.b-s.a)*100}%"></i></div>`;
  }else if(s.k==='break'){
    el.innerHTML=`<small>☕ Перерва ${s.a-s.b} хв</small><h2>Далі: ${nm(s.ls[s.j])}</h2><div class="big">${hms(s.a-min)}</div><div>до ${s.j+1} уроку о ${T[s.j].split('-')[0]}</div><div class="bar"><i style="width:${(min-s.b)/(s.a-s.b)*100}%"></i></div>`;
  }else if(s.k==='before'){
    el.innerHTML=`<small>Сьогодні ${s.ls.length} уроків</small><h2>Перший: ${nm(s.ls[0])}</h2><div class="big">${hms(s.a-min)}</div><div>до початку о 8:30</div>`;
  }else{
    const n=nextDay(wd);
    el.innerHTML=`<small>Уроки закінчились 🎉</small><h2>Далі: ${D[n][0]}</h2><div>Перший урок — ${nm(D[n][1][0])} о 8:30</div>`;
  }
  // day progress
  const ls=D[wd]?.[1];
  if(ls){const a=R[0][0],b=R[ls.length-1][1],p=Math.min(1,Math.max(0,(min-a)/(b-a)));
    $('dp').innerHTML=`Навчальний день: ${Math.round(p*100)}%<div class="bar"><i style="width:${p*100}%"></i></div>`}
  else $('dp').textContent='Вихідний 😎';
  // notifications
  if(notifOn&&(s.k==='break'||s.k==='before')&&s.a-min<=2&&s.a-min>0){
    const key=wd+'-'+s.j;
    if(key!==lastNotif){lastNotif=key;try{new Notification('Через 2 хв: '+nm(s.ls[s.j]),{body:`${s.j+1} урок о ${T[s.j].split('-')[0]}`})}catch{}}
  }
}

function renderSide(){
  const{wd,min}=now(),s=status(wd,min);
  const t=(s.k==='done'||!D[wd])?nextDay(wd):wd;
  $('bagT').textContent=t===wd?'Рюкзак на сьогодні':'Рюкзак на '+D[t][0].toLowerCase();
  const u=[...new Set(D[t][1].map(nm))];
  $('bag').innerHTML=u.map(x=>`<span class="chip" style="background:${C[x]}">${x}</span>`).join('');
  const cnt={};D.forEach(([,l])=>l.forEach(x=>cnt[nm(x)]=(cnt[nm(x)]||0)+1));
  $('stats').innerHTML=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="chip" data-s="${k}" style="background:${C[k]};${hl&&hl!==k?'opacity:.35':''}">${k}<b>×${v}</b></button>`).join('');
}

$('stats').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;hl=hl===b.dataset.s?null:b.dataset.s;renderGrid();renderSide()};
$('tabs').innerHTML=['Весь тиждень',...D.map(x=>x[0])].map((t,i)=>`<button data-i="${i-1}">${t}</button>`).join('');
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel=+b.dataset.i<0?null:+b.dataset.i;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));renderGrid()};
$('tabs').children[0].classList.add('on');
$('theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.theme=r.dataset.theme}catch{}};
try{if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme}catch{}
const setN=()=>$('notif').classList.toggle('on',notifOn);
$('notif').onclick=async()=>{
  if(!('Notification'in window))return alert('Браузер не підтримує сповіщення');
  if(!notifOn&&Notification.permission!=='granted'&&await Notification.requestPermission()!=='granted')return;
  notifOn=!notifOn;try{localStorage.notif=notifOn?'1':'0'}catch{}setN();
};
setN();
renderGrid();renderSide();renderNow();
setInterval(()=>renderNow(),1000);
setInterval(()=>{renderGrid();renderSide()},20000);
const E={'Математика':'🔢','Всесв. історія':'🏛️','Література':'📚','Англ. мова':'🇬🇧','Укр. мова':'✍️','STEM':'🤖','Інформатика':'💻','Географія':'🌍','Фіз-ра':'⚽','Технології':'🛠️','Громад. освіта':'🤝','Довкілля':'🌱','Мистецтво':'🎨','ЗБД':'🦺'};
const F=['Восьминіг має три серця і блакитну кров 🐙','Мед ніколи не псується — його знаходили в єгипетських пірамідах 🍯','Равлик може спати до 3 років 🐌','У космосі неможливо заплакати — сльози не падають 🚀','Банани — це ягоди, а полуниця — ні 🍌','Серце кита розміром з автомобіль 🐋','Блискавка гарячіша за поверхню Сонця ⚡','Мурахи ніколи не сплять по-справжньому 🐜','Жирафи сплять лише 30 хвилин на добу 🦒','На Венері день довший за рік 🪐','Коти сплять близько 16 годин на день 🐱','Дельфіни дають одне одному імена 🐬','Метелики відчувають смак ногами 🦋','В Україні понад 70 000 річок 🌊'];
let fi=Math.floor(Date.now()/864e5)%F.length;
const showFact=()=>$('fact').textContent=F[fi%F.length];
$('nf').onclick=()=>{fi++;showFact()};showFact();
const day=new Date().toDateString();let stars=0;
try{const o=JSON.parse(localStorage.stars||'{}');if(o.d===day)stars=o.n}catch{}
const showStars=()=>$('st').textContent=stars?'⭐'.repeat(stars):'—';
$('addst').onclick=e=>{if(stars<10)stars++;try{localStorage.stars=JSON.stringify({d:day,n:stars})}catch{}showStars();boom(e.clientX,e.clientY,30)};showStars();
function weekend(){const{d,wd,min}=now();
  if(wd<0||wd>4)return $('wk').textContent='Ура, вихідні! Відпочивай 🎉';
  const left=(4-wd)*1440+(R[D[4][1].length-1][1]-min);
  $('wk').innerHTML=left<=0?'Вихідні вже тут! 🥳':`Ще <b>${Math.floor(left/1440)} д ${Math.floor(left%1440/60)} год</b> — і вихідні! 🏖️`}
weekend();setInterval(weekend,30000);
// emoji on lessons
const _rg=renderGrid;renderGrid=function(){_rg();document.querySelectorAll('.l .s').forEach(x=>{const k=x.firstChild.textContent.trim();if(E[k])x.firstChild.textContent=E[k]+' '+x.firstChild.textContent})};
const _rn=renderNow;renderNow=function(){_rn();const h=$('now').querySelector('h2');if(!h)return;const k=Object.keys(E).find(k=>h.textContent.includes(k));$('now').insertAdjacentHTML('beforeend',`<span class="em">${k?E[k]:'🎉'}</span>`)};
// confetti
const cv=document.createElement('canvas');cv.id='cf';document.body.append(cv);const cx=cv.getContext('2d');let P=[];
function boom(x=innerWidth/2,y=innerHeight/3,n=120){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6,life:90+Math.random()*40});
  if(P.length===n)requestAnimationFrame(tick)}
function tick(){cv.width=innerWidth;cv.height=innerHeight;P=P.filter(p=>p.life-->0);
  P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore()});
  if(P.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}
$('now').onclick=e=>boom(e.clientX,e.clientY,60);
let wasDone=status(now().wd,now().min).k==='done';
setInterval(()=>{const d=status(now().wd,now().min).k==='done';if(d&&!wasDone)boom();wasDone=d},1000);
renderGrid();renderNow();

// ===== Оцінки та нагороди =====
let RATE={12:150,11:120,10:100,9:70,8:50,7:30,6:10,5:0,4:-20,3:-40,2:-70,1:-100},BON=[];
const M=x=>x.m??RATE[x.g]??0;
const GC=g=>g>=10?'#00b894':g>=7?'#0984e3':g>=4?'#e1a800':'#d63031';
const uah=v=>(v>0?'+':'')+v+' ₴';
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let G=[],A=[],PAY=[],canPay=false,store;
$('gs').innerHTML=Object.keys(C).map(k=>`<option>${k}</option>`).join('');
$('gd').value=iso(new Date());
$('gb').innerHTML=Array.from({length:12},(_,i)=>12-i).map(g=>`<button data-g="${g}" style="background:${GC(g)}" title="${uah(RATE[g])}">${g}</button>`).join('');
// сховище: спільна БД claude.ai або localStorage як запасний варіант
const local={
  load(){try{const o=JSON.parse(localStorage.grades||'{}');return{g:o.g||[],a:o.a||[],p:o.p||[]}}catch{return{g:[],a:[],p:[]}}},
  save(){try{localStorage.grades=JSON.stringify({g:G,a:A,p:PAY})}catch{}},
  arr(c){return c==='grades'?G:c==='approved'?A:PAY},
  async add(col,d){this.arr(col).push({id:Math.random().toString(36).slice(2),...d});this.save();renderGrades()},
  async put(col,id,d){this.arr(col).push({id,...d});this.save();renderGrades()},
  async del(col,id){const a=this.arr(col),i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);this.save();renderGrades()}
};
function useLocal(){store=local;const o=local.load();G=o.g;A=o.a;PAY=o.p;canPay=true;$('gmode').textContent='📱 тільки на цьому пристрої';renderGrades()}
function renderGrades(){
  const today=iso(new Date()),d=new Date(),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const wk=iso(mon),mo=today.slice(0,7);
  const sum=f=>A.filter(f).reduce((a,x)=>a+M(x),0)+BON.filter(f).reduce((a,x)=>a+x.amount,0);
  $('rates').textContent='Курс: '+Object.entries(RATE).sort((a,b)=>b[0]-a[0]).map(([g,v])=>`${g} → ${uah(v)}`).join(' · ');
  const set=(id,v)=>{$(id).textContent=uah(v);$(id).className=v>0?'pos':v<0?'neg':''};
  set('sD',sum(x=>x.date===today));set('sW',sum(x=>x.date>=wk&&x.date<=today));set('sM',sum(x=>x.date.slice(0,7)===mo));
  const bal=sum(()=>true)-PAY.reduce((a,x)=>a+x.amount,0);set('sB',bal);
  $('pay').hidden=!(canPay&&bal>0);
  // рівень
  const xp=A.reduce((a,x)=>a+x.g,0),lv=Math.floor(xp/50)+1,p=(xp%50)/50*100;
  $('lvl').innerHTML=`Рівень ${lv} · ${xp} XP <small style="color:var(--muted);font-weight:600">(ще ${50-xp%50} до наступного)</small><div class="bar"><i style="width:${p}%"></i></div>`;
  const srt=[...A].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
  let run=0,best=0;srt.forEach(x=>{run=x.g>=10?run+1:0;best=Math.max(best,run)});
  const B=[['🎯 Перша оцінка',A.length>0],['👑 Перша 12',A.some(x=>x.g===12)],['🔥 3 десятки поспіль',best>=3],['🚀 5 поспіль ≥10',best>=5],['📚 20 оцінок',A.length>=20],['💯 50 оцінок',A.length>=50],['💰 Заробив 1000 ₴',sum(()=>true)>=1000],['🌈 Тиждень без мінусів',A.filter(x=>x.date>=wk).length>=3&&A.filter(x=>x.date>=wk).every(x=>M(x)>=0)]];
  $('badges').innerHTML=B.map(([t,ok])=>`<span class="bd ${ok?'got':''}">${t}</span>`).join('');
  const aid=new Set(A.map(x=>x.id)),pend=G.filter(x=>!aid.has(x.id));
  const list=[...pend.map(x=>({...x,k:'w'})),...A.map(x=>({...x,k:'g'})),...PAY.map(x=>({...x,k:'p'})),...BON.map(x=>({...x,k:'b'}))].sort((a,b)=>(b.date+(b.t||0))>(a.date+(a.t||0))?1:-1).slice(0,40);
  const dt=x=>new Date(x.date).toLocaleDateString('uk-UA',{weekday:'short',day:'numeric',month:'short'});
  $('pendN').textContent=pend.length?`⏳ ${pend.length} чекає підтвердження`:'';
  $('gl').innerHTML=list.length?list.map(x=>x.k==='w'
    ?`<div class="gi wait"><span class="g" style="background:${GC(x.g)}">${x.g}</span><span>${E[x.s]||''} ${x.s}<small>${dt(x)} · ⏳ чекає підтвердження батьків</small></span><b style="color:var(--muted)">${uah(RATE[x.g])}</b>${canPay?`<span><button class="ok" data-ok="${x.id}" title="Підтвердити">✓</button><button class="x" data-del="grades:${x.id}" title="Відхилити">✕</button></span>`:`<button class="x" data-del="grades:${x.id}" title="Видалити">✕</button>`}</div>`
    :x.k==='g'
    ?`<div class="gi"><span class="g" style="background:${GC(x.g)}">${x.g}</span><span>${E[x.s]||''} ${x.s}<small>${dt(x)} · ✅ підтверджено</small></span><b class="${M(x)>0?'pos':M(x)<0?'neg':''}">${uah(M(x))}</b>${canPay?`<button class="x" data-del="approved:${x.id}" title="Скасувати підтвердження">↺</button>`:'<span></span>'}</div>`
    :x.k==='b'?`<div class="gi"><span class="g" style="background:linear-gradient(135deg,#fdcb6e,#e17055)">🎁</span><span>${x.note||'Бонус'}<small>${dt(x)}</small></span><b class="${x.amount>=0?'pos':'neg'}">${uah(x.amount)}</b><span></span></div>`
    :`<div class="gi"><span class="g" style="background:#636e72">💸</span><span>Виплачено<small>${new Date(x.date).toLocaleDateString('uk-UA',{day:'numeric',month:'short'})}</small></span><b>−${x.amount} ₴</b>${canPay?`<button class="x" data-del="payouts:${x.id}">✕</button>`:'<span></span>'}</div>`).join('')
    :'<p style="color:var(--muted)">Ще немає оцінок — натисни на цифру вище 👆</p>';
}
$('gb').onclick=async e=>{const b=e.target.closest('[data-g]');if(!b||!store)return;const g=+b.dataset.g;
  b.disabled=true;const d={s:$('gs').value,g,date:$('gd').value||iso(new Date()),t:Date.now()};try{const r=await store.add('grades',d);if(canPay&&store!==local)await store.put('approved',r.id,{...d,m:RATE[g]??0});if(g>=10)boom(e.clientX,e.clientY,g===12?150:70)}catch(err){alert('Не вдалося зберегти: '+(err.message||err.code))}b.disabled=false};
$('gl').onclick=async e=>{const ok=e.target.closest('[data-ok]');if(ok){const x=G.find(g=>g.id===ok.dataset.ok);ok.disabled=true;try{await store.put('approved',x.id,{s:x.s,g:x.g,m:RATE[x.g]??0,date:x.date,t:x.t||Date.now()});if(x.g>=10)boom(e.clientX,e.clientY,80)}catch(err){alert(err.message||err.code);ok.disabled=false}return}
  const b=e.target.closest('[data-del]');if(!b||!confirm(b.dataset.del.startsWith('approved')?'Скасувати підтвердження? Оцінка знову стане «чекає».':'Видалити запис?'))return;const[c,id]=b.dataset.del.split(':');try{await store.del(c,id)}catch(err){alert(err.message||err.code)}};
$('pay').onclick=async()=>{const bal=parseInt($('sB').textContent.replace(/[^\d-]/g,''));const v=prompt('Скільки виплачено, ₴?',bal);const n=parseInt(v);if(!(n>0))return;
  try{await store.add('payouts',{amount:n,date:iso(new Date()),t:Date.now()});boom()}catch(err){alert(err.message||err.code)}};
renderGrades();
fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(c=>{if(!c)return;
  if(c.rates)RATE={...RATE,...Object.fromEntries(Object.entries(c.rates).map(([k,v])=>[k,+v||0]))};
  if(Array.isArray(c.bonuses))BON=c.bonuses.filter(b=>b&&/^\d{4}-\d\d-\d\d$/.test(b.date)&&Number.isFinite(+b.amount)).map((b,i)=>({id:'b'+i,date:b.date,amount:+b.amount,note:String(b.note||''),t:0}));
  renderGrades()}).catch(()=>{});
(async()=>{
  const db=window.claude?.use?await window.claude.use('db'):null;
  if(!db)return useLocal();
  const P=c=>c==='grades'?'grades':'data/parent/'+c;
  const u=await window.claude.use('user');canPay=u?.isOwner()??false;
  store={
    add:(col,d)=>db.collection(P(col)).add(d),
    put:(col,id,d)=>db.doc(P(col)+'/'+id).set(d),
    del:(col,id)=>db.doc(P(col)+'/'+id).delete()
  };
  $('gmode').textContent='☁️ синхронізовано';
  const map=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
  db.collection('grades').onSnapshot(s=>{G=map(s);renderGrades()},()=>useLocal());
  db.collection(P('approved')).onSnapshot(s=>{A=map(s);renderGrades()});
  db.collection(P('payouts')).onSnapshot(s=>{PAY=map(s);renderGrades()});
})();
</script>
</body>
</html>
